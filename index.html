<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panel de Clientes — Bienes Raíces</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E3A44">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Clientes">
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg: #F1F4EF;
  --surface: #FFFFFF;
  --surface-2: #E8EEE6;
  --ink: #17231F;
  --ink-soft: #5B6A62;
  --ocean: #0E3A44;
  --ocean-light: #1C5866;
  --ocean-pale: #DCE9E8;
  --coral: #E4572E;
  --coral-dark: #C7431E;
  --coral-pale: #FBE4DB;
  --gold: #B8863F;
  --gold-pale: #F3E7D1;
  --line: #D7DED0;
  --danger: #B0392C;
  --danger-pale: #F6E1DC;
  --radius-sm: 4px;
  --radius-md: 10px;
  --font-serif: 'Source Serif 4', Georgia, serif;
  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --shadow-soft: 0 1px 2px rgba(14,58,68,0.06), 0 4px 16px rgba(14,58,68,0.06);
}

*{ box-sizing: border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea{ font-family: inherit; font-size: inherit; color: inherit; }
button{ cursor:pointer; }
a{ color: var(--ocean-light); }

/* Layout */
.app{ display:flex; min-height:100vh; }

.sidebar{
  width: 232px;
  flex-shrink:0;
  background: var(--ocean);
  color: #EAF1EE;
  display:flex;
  flex-direction:column;
  padding: 24px 16px;
  position: sticky;
  top:0;
  height:100vh;
}
.brand{
  font-family: var(--font-serif);
  font-size: 20px;
  line-height:1.25;
  font-weight:600;
  color:#fff;
  padding: 0 8px 22px 8px;
  border-bottom: 1px solid rgba(255,255,255,0.14);
  margin-bottom: 18px;
}
.brand small{
  display:block;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight:500;
  color: rgba(234,241,238,0.6);
  margin-top: 4px;
}
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav-item{
  display:flex; align-items:center; gap:10px;
  background:none; border:none; text-align:left;
  padding: 10px 10px;
  border-radius: var(--radius-sm);
  color: rgba(234,241,238,0.78);
  font-size: 14px;
  font-weight:500;
  transition: background .15s ease, color .15s ease;
}
.nav-item:hover{ background: rgba(255,255,255,0.07); color:#fff; }
.nav-item.active{ background: rgba(255,255,255,0.12); color:#fff; }
.nav-item .dot{ width:6px; height:6px; border-radius:50%; background: currentColor; opacity:.55; flex-shrink:0; }
.nav-item.active .dot{ background: var(--coral); opacity:1; }

.nav-cta{
  margin-top: 18px;
  background: var(--coral);
  color: #fff;
  border:none;
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  font-weight:600;
  font-size: 14px;
  text-align:left;
  transition: background .15s ease;
}
.nav-cta:hover{ background: var(--coral-dark); }

.sidebar-foot{
  margin-top:auto;
  padding: 12px 10px 0 10px;
  font-size: 12px;
  color: rgba(234,241,238,0.45);
  border-top: 1px solid rgba(255,255,255,0.1);
}

.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  padding: 26px 36px 0 36px;
}
.topbar h1{
  font-family: var(--font-serif);
  font-size: 27px;
  font-weight:600;
  margin: 0 0 4px 0;
}
.topbar p{
  margin:0;
  color: var(--ink-soft);
  font-size: 14px;
  max-width: 62ch;
}
.content{ padding: 22px 36px 60px 36px; flex:1; }

/* Stat cards */
.stat-row{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom: 26px; }
.stat-card{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  min-width: 168px;
  flex:1;
}
.stat-card .num{
  font-family: var(--font-serif);
  font-size: 30px;
  font-weight:600;
  line-height:1;
  color: var(--ocean);
}
.stat-card .label{
  font-size: 12.5px;
  color: var(--ink-soft);
  margin-top: 6px;
}

.panel{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 20px 22px;
  margin-bottom: 20px;
}
.panel h2{
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight:600;
  margin: 0 0 14px 0;
}
.panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; gap:12px; flex-wrap:wrap;}
.panel-head h2{ margin:0; }

/* bars */
.bar-row{ display:flex; align-items:center; gap:12px; padding: 7px 0; }
.bar-row .bar-label{ width: 190px; flex-shrink:0; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar-track{ flex:1; height:8px; background: var(--surface-2); border-radius:4px; overflow:hidden; }
.bar-fill{ height:100%; background: var(--ocean-light); border-radius:4px; }
.bar-count{ width: 28px; text-align:right; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.empty{
  text-align:center;
  padding: 34px 18px;
  color: var(--ink-soft);
}
.empty .empty-title{ font-family: var(--font-serif); font-size:16px; color: var(--ink); margin-bottom:6px; }
.empty button{
  margin-top: 14px;
  background: var(--coral); color:#fff; border:none;
  padding: 9px 16px; border-radius: var(--radius-sm); font-weight:600; font-size:13.5px;
}

/* Table */
.table-wrap{ overflow-x:auto; }
table.data{ width:100%; border-collapse: collapse; font-size: 13.5px; }
table.data th{
  text-align:left; font-weight:600; color: var(--ink-soft);
  font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line);
  white-space:nowrap;
}
table.data td{
  padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top;
}
table.data tr:last-child td{ border-bottom:none; }
.name-cell{ font-weight:600; }
.sub{ color: var(--ink-soft); font-size:12px; }
.badge{
  display:inline-block; font-size:11.5px; font-weight:600; padding:3px 8px;
  border-radius: 100px; background: var(--ocean-pale); color: var(--ocean);
  margin: 2px 4px 2px 0;
}
.badge.gold{ background: var(--gold-pale); color:#7A5A22; }
.link-btn{
  background:none; border:none; color: var(--ocean-light); font-weight:600; font-size:12.5px; padding:4px 6px;
  border-radius: var(--radius-sm);
}
.link-btn:hover{ background: var(--surface-2); }
.link-btn.danger{ color: var(--danger); }
.contact-link{ color: var(--ink); text-decoration:none; border-bottom: 1px dashed var(--line); }
.contact-link:hover{ border-bottom-color: var(--ocean-light); }

/* Filters */
.filter-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom: 16px; align-items:center; }
.input, select.input, textarea.input{
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 9px 11px; background:#fff; width:100%;
}
.input:focus, select.input:focus, textarea.input:focus{ outline: 2px solid var(--ocean-light); outline-offset:1px; border-color: var(--ocean-light); }
.search-input{ max-width: 280px; }
.chip{
  border: 1px solid var(--line); background:#fff; border-radius:100px; padding: 6px 12px;
  font-size: 12.5px; font-weight:500; color: var(--ink-soft);
  display:inline-flex; align-items:center; gap:6px;
}
.chip.active{ background: var(--ocean); border-color: var(--ocean); color:#fff; }

/* Form */
.form-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.form-grid .full{ grid-column: 1 / -1; }
.field label{ display:block; font-size:12.5px; font-weight:600; color: var(--ink-soft); margin-bottom:5px; }
.field .hint{ font-size:11.5px; color: var(--ink-soft); margin-top:4px; }
.field .err{ font-size:11.5px; color: var(--danger); margin-top:4px; display:none; }
.field.has-error .err{ display:block; }
.field.has-error .input{ border-color: var(--danger); }
.group-check-grid{
  display:flex; flex-wrap:wrap; gap:8px; padding: 10px; border:1px solid var(--line); border-radius: var(--radius-sm); background: #FBFCFA; max-height:170px; overflow-y:auto;
}
.group-check{ display:flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line); border-radius:100px; padding:5px 10px 5px 8px; font-size:12.5px; }
.group-check input{ margin:0; }
.status-picker{ display:flex; flex-wrap:wrap; gap:8px; }
.status-chip{
  display:inline-flex; align-items:center; gap:7px;
  border:1px solid var(--line); background:#fff; border-radius:100px; padding:8px 14px;
  font-size:13px; font-weight:600; color: var(--ink-soft);
}
.status-chip.active{ background: var(--status-color); border-color: var(--status-color); color:#fff; }
.reminder-fields{ display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; }
.reminder-fields .field{ min-width:160px; }
.reminder-alert{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background: var(--coral-pale); border:1px solid var(--coral); color: var(--coral-dark);
  border-radius: var(--radius-sm); padding:6px 10px; margin-top:6px; font-size:12.5px; font-weight:700;
}
.reminder-dash-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:12px 0; border-bottom:1px dashed rgba(192,57,43,0.25);
}
.reminder-dash-row:last-child{ border-bottom:none; }
.notes-history{ display:flex; flex-direction:column; gap:10px; max-height:260px; overflow-y:auto; padding-right:2px; }
.note-entry{ border:1px solid var(--line); border-radius: var(--radius-sm); padding:10px 12px; background:#FBFCFA; }
.note-entry-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:5px; }
.note-date{ font-size:11px; font-weight:700; color: var(--ocean); text-transform:uppercase; letter-spacing:.03em; }
.note-text{ font-size:13.5px; line-height:1.45; white-space:pre-wrap; }
.inline-add{ display:flex; gap:8px; margin-top:10px; }
.inline-add .input{ flex:1; }
.btn{
  border:none; border-radius: var(--radius-sm); padding: 10px 16px; font-weight:600; font-size:13.5px;
}
.btn-primary{ background: var(--coral); color:#fff; }
.btn-primary:hover{ background: var(--coral-dark); }
.btn-secondary{ background: var(--surface-2); color: var(--ink); }
.btn-secondary:hover{ background: var(--line); }
.btn-ghost{ background: none; color: var(--ink-soft); border:1px solid var(--line); }
.form-actions{ display:flex; gap:10px; margin-top: 18px; }

/* Group cards */
.group-card{ border:1px solid var(--line); border-radius: var(--radius-md); margin-bottom:12px; overflow:hidden; }
.group-card-head{ display:flex; align-items:center; justify-content:space-between; padding: 14px 16px; cursor:pointer; background:#fff; }
.group-card-head:hover{ background: #FBFCFA; }
.group-card-title{ display:flex; align-items:baseline; gap:10px; }
.group-card-title h3{ margin:0; font-family: var(--font-serif); font-size:16px; font-weight:600; }
.group-card-count{ font-size:12px; color: var(--ink-soft); }
.group-card-actions{ display:flex; gap:6px; align-items:center; }
.group-card-body{ border-top:1px solid var(--line); padding: 6px 16px 14px 16px; background:#FBFCFA; }
.group-member{ display:flex; align-items:center; justify-content:space-between; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size:13px; gap:10px;}
.group-member:last-child{ border-bottom:none; }
.group-bulk-actions{ display:flex; gap:8px; padding: 12px 0 4px 0; flex-wrap:wrap; }

/* Modal */
.modal-overlay{
  position: fixed; inset:0; background: rgba(15,29,26,0.45); display:flex; align-items:flex-start; justify-content:center;
  padding: 40px 20px; overflow-y:auto; z-index: 40;
}
.modal-box{
  background:#fff; border-radius: var(--radius-md); max-width: 640px; width:100%; padding: 24px 26px; box-shadow: var(--shadow-soft);
}
.modal-box h2{ font-family: var(--font-serif); font-size:19px; margin:0 0 4px 0; }
.modal-box .modal-sub{ color: var(--ink-soft); font-size:13px; margin: 0 0 18px 0; }
.modal-close-row{ display:flex; justify-content:flex-end; }

/* Toast */
#toast-wrap{ position: fixed; bottom: 22px; right: 22px; display:flex; flex-direction:column; gap:8px; z-index: 60; }
.toast{
  background: var(--ocean); color:#fff; padding: 11px 16px; border-radius: var(--radius-sm); font-size: 13.5px;
  box-shadow: var(--shadow-soft); max-width: 320px; animation: toast-in .18s ease;
}
.toast.err{ background: var(--danger); }
@keyframes toast-in{ from{ opacity:0; transform: translateY(6px);} to{opacity:1; transform:none;} }

.loading-screen{ display:flex; align-items:center; justify-content:center; height:100vh; width:100%; color: var(--ink-soft); font-size:14px; }
.login-screen{ display:flex; align-items:center; justify-content:center; min-height:100vh; width:100%; background: var(--bg); padding:20px; }
.login-box{ background:#fff; border:1px solid var(--line); border-radius: var(--radius-md); padding:28px 26px; max-width:380px; width:100%; box-shadow: var(--shadow-soft); }
.login-box .field{ margin-bottom:14px; }

@media (max-width: 860px){
  .form-grid{ grid-template-columns: 1fr; }
}
@media (max-width: 720px){
  .app{ flex-direction:column; }
  .sidebar{ width:100%; height:auto; position:relative; flex-direction:row; align-items:center; padding: 12px 14px; gap: 8px; overflow-x:auto; }
  .brand{ border-bottom:none; padding: 0 12px 0 0; margin-bottom:0; border-right: 1px solid rgba(255,255,255,0.14); }
  .brand small{ display:none; }
  .nav{ flex-direction:row; }
  .nav-cta{ margin-top:0; white-space:nowrap; }
  .sidebar-foot{ display:none; }
  .topbar, .content{ padding-left: 18px; padding-right: 18px; }
  table.data thead{ display:none; }
  table.data, table.data tbody, table.data tr, table.data td{ display:block; width:100%; }
  table.data tr{ border-bottom: 1px solid var(--line); padding: 10px 0; }
  table.data td{ border-bottom:none; padding: 4px 0; }
  table.data td::before{ content: attr(data-label); display:block; font-size:11px; font-weight:600; color: var(--ink-soft); margin-bottom:2px; }
}
</style>
</head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword,
    createUserWithEmailAndPassword, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // 👇 PEGA AQUÍ los datos de tu proyecto de Firebase (Configuración del
  // proyecto → Tus apps → SDK setup and configuration → Config).
  const firebaseConfig = {
    apiKey: "AIzaSyDoqMryx4tqX6VuX1Y4auR7G5-kvSALZRg",
    authDomain: "freddy-bbcc4.firebaseapp.com",
    projectId: "freddy-bbcc4",
    storageBucket: "freddy-bbcc4.firebasestorage.app",
    messagingSenderId: "16603541238",
    appId: "1:16603541238:web:b493a19e47b548e7ee06d7",
  };

  const isConfigured = !!(firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('PEGA_AQUI'));

  if(isConfigured){
    try{
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      window.__firebaseBridge = {
        isConfigured: true,
        onAuthStateChanged: (cb) => onAuthStateChanged(auth, cb),
        signIn: (email, password) => signInWithEmailAndPassword(auth, email, password),
        signUp: (email, password) => createUserWithEmailAndPassword(auth, email, password),
        signOut: () => signOut(auth),
        watchData: (uid, cb, errCb) => onSnapshot(doc(db, 'panelData', uid), cb, errCb),
        saveData: (uid, data) => setDoc(doc(db, 'panelData', uid), data, { merge: true }),
      };
    }catch(e){
      console.error('Firebase no se pudo inicializar:', e);
      window.__firebaseBridge = { isConfigured: false };
    }
  } else {
    window.__firebaseBridge = { isConfigured: false };
  }
  window.dispatchEvent(new Event('firebase-bridge-ready'));
</script>

<script>
/* ============================================================
   ESTADO
============================================================ */
let clients = [];
let groups = [];
let activeTab = 'dashboard';
let dataReady = false;
let clientSearch = '';
let clientGroupFilter = [];
let clientStatusFilter = [];
let groupSearch = '';
let expandedGroupId = null;
let editingGroupId = null;
let currentUid = null;
let authChecked = false;
let loginMode = 'signin';
let loginError = '';
let firebaseUnsubscribe = null;
function firebaseEnabled(){ return !!(window.__firebaseBridge && window.__firebaseBridge.isConfigured); }
let modalClientId = null; // id del cliente en edición (modal), null = cerrado
let formErrors = {};
let modalFormErrors = {};

const STORAGE_KEY_CLIENTS = 'clients_v1';
const STORAGE_KEY_GROUPS = 'groups_v1';

const DEFAULT_GROUPS = [
  'Terreno frente al mar',
  'Terreno en Manta',
  'Casa en Barbasquillo',
  'Departamento frente al mar - Bahía'
];

/* ============================================================
   UTILIDADES
============================================================ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  if(!d) return '—';
  const parts = d.split('-');
  if(parts.length!==3) return d;
  const [y,m,day] = parts;
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${day} ${meses[parseInt(m,10)-1]} ${y}`;
}
function digitsOnly(s){ return (s||'').replace(/[^0-9]/g,''); }
function waLink(phone){
  const d = digitsOnly(phone);
  if(!d) return null;
  return `https://wa.me/${d}`;
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function groupById(id){ return groups.find(g => g.id === id); }
function clientsInGroup(gid){ return clients.filter(c => (c.groupIds||[]).includes(gid)); }
function sortedGroups(list){
  return [...(list || groups)].sort((a,b) => a.name.localeCompare(b.name, 'es', { sensitivity:'base' }));
}

/* Color por primera letra: todos los intereses que empiezan igual comparten color
   (ej. "Casa en Manta", "Casa en Chone" y "Casa en Portoviejo" salen del mismo color;
   "Terreno frente al mar" y "Terreno zona norte" salen de otro color distinto). */
const GROUP_COLOR_PALETTE = ['#1C5866','#E4572E','#B8863F','#4C6B52','#6B4C86','#2E6F8E','#A9432E','#7A6A2E','#8C4B6B','#3D6B8C','#5A7A2E','#9C5A2E'];
function firstLetterOf(name){
  const trimmed = (name || '').trim();
  if(!trimmed) return '#';
  return trimmed.charAt(0).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
}
function colorForGroup(g){
  if(!g || !g.name) return 'var(--ink-soft)';
  const letter = firstLetterOf(g.name);
  const code = letter.charCodeAt(0);
  const idx = ((code - 65) % GROUP_COLOR_PALETTE.length + GROUP_COLOR_PALETTE.length) % GROUP_COLOR_PALETTE.length;
  return GROUP_COLOR_PALETTE[idx];
}
function colorDot(color, size){
  return `<span style="display:inline-block; width:${size||8}px; height:${size||8}px; border-radius:50%; background:${color}; flex-shrink:0;"></span>`;
}
function groupBadgeHtml(gid){
  const g = groupById(gid);
  if(!g) return '';
  const c = colorForGroup(g);
  return `<span class="badge" style="background:${c}1F; color:${c}; border:1px solid ${c}55;">${escapeHtml(g.name)}</span>`;
}

/* ---- Estado del cliente (frío / tibio / caliente) ---- */
const STATUS_MAP = {
  frio: { label: 'Frío', color: '#2E6F8E' },
  tibio: { label: 'Tibio', color: '#D98E2E' },
  caliente: { label: 'Caliente', color: '#C0392B' },
};
const STATUS_OPTIONS = [
  { id: '', label: 'Sin definir', color: '#9AA79E' },
  { id: 'frio', label: STATUS_MAP.frio.label, color: STATUS_MAP.frio.color },
  { id: 'tibio', label: STATUS_MAP.tibio.label, color: STATUS_MAP.tibio.color },

/* ---- Notas: se guardan como un historial fechado, no como un solo texto ---- */
function latestNote(c){
  const notes = c.notes || [];
  if(notes.length === 0) return null;
  return [...notes].sort((a,b) => (b.date||'').localeCompare(a.date||''))[0];
}
function notesPreviewHtml(c){
  const n = latestNote(c);
  if(!n) return '';
  const extra = (c.notes||[]).length > 1 ? ` <span class="sub">(+${c.notes.length - 1} nota${c.notes.length - 1===1?'':'s'} más)</span>` : '';
  return `<div class="sub">${escapeHtml(n.text)}${extra}</div>`;
}
/* Compatibilidad con clientes guardados antes de este cambio (nota como texto suelto) */
function normalizeClient(c){
  let notes = c.notes;
  if(typeof notes === 'string'){
    notes = notes.trim() ? [{ id: uid(), text: notes.trim(), date: c.createdAt || todayStr() }] : [];
  } else if(!Array.isArray(notes)){
    notes = [];
  }
  return { ...c, notes, status: c.status || '', reminder: c.reminder || null };
}

/* ---- Recordatorio (tipo alarma con fecha) ---- */
function reminderIsActive(c){
  return !!(c.reminder && c.reminder.date && c.reminder.date <= todayStr());
}
function reminderRowStyle(c){
  return reminderIsActive(c) ? 'background:var(--coral-pale);' : '';
}
function reminderBadgeHtml(c){
  if(!c.reminder || !c.reminder.date) return '';
  const noteText = c.reminder.note ? escapeHtml(c.reminder.note) : 'Seguimiento pendiente';
  if(reminderIsActive(c)){
    const isOverdue = c.reminder.date < todayStr();
    const whenLabel = isOverdue ? `Venció el ${fmtDate(c.reminder.date)}` : 'Para hoy';
    return `
      <div class="reminder-alert">

        <button type="button" class="link-btn" data-dismissreminder="${c.id}" style="color:var(--coral-dark);">Listo</button>
      </div>

  }
  return `<div class="sub">🔔 Recordatorio: ${fmtDate(c.reminder.date)} — ${noteText}</div>`;
}
async function handleDismissReminder(id){

function toast(msg, type){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type==='err' ? ' err' : '');
  el.textContent = msg;
  wrap.appendChild(el);

}

/* ============================================================
   PERSISTENCIA
   Dentro de Claude.ai se usa window.storage (queda ligado a tu cuenta de Claude).
   Si la página se abre fuera de Claude.ai (archivo local o alojada en un sitio
   propio), window.storage no existe y se usa localStorage del navegador.
============================================================ */
const CLAUDE_STORAGE_AVAILABLE = !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function');

async function storageGet(key){
  if(CLAUDE_STORAGE_AVAILABLE){
    const res = await window.storage.get(key, true);
    return res ? res.value : null;
  }
  return window.localStorage.getItem(key);
}
async function storageSet(key, value){
  if(CLAUDE_STORAGE_AVAILABLE){
    const res = await window.storage.set(key, value, true);
    return !!res;
  }
  window.localStorage.setItem(key, value);
  return true;
}

function seedDefaultGroups(){
  return DEFAULT_GROUPS.map(name => ({ id: uid(), name, createdAt: todayStr() }));
}

async function loadAll(){
  if(!CLAUDE_STORAGE_AVAILABLE && firebaseEnabled()){
    initFirebaseAuthFlow();
    return;
  }
  try{
    const v = await storageGet(STORAGE_KEY_CLIENTS);
    clients = v ? JSON.parse(v).map(normalizeClient) : [];
  }catch(e){
    clients = [];
  }
  try{
    const v = await storageGet(STORAGE_KEY_GROUPS);
    if(v === null || v === undefined) throw new Error('sin grupos guardados todavía');
    groups = JSON.parse(v);
  }catch(e){
    // primera vez que se usa el panel: sembrar grupos de ejemplo
    groups = seedDefaultGroups();
    try{ await storageSet(STORAGE_KEY_GROUPS, JSON.stringify(groups)); }catch(e2){}
  }
  dataReady = true;
  render();
}

async function persistClients(){
  if(firebaseEnabled() && currentUid){
    try{ await window.__firebaseBridge.saveData(currentUid, { clients }); }
    catch(e){ toast('No se pudo guardar en la nube. Revisa tu conexión.', 'err'); }
    return;
  }
  try{
    const ok = await storageSet(STORAGE_KEY_CLIENTS, JSON.stringify(clients));
    if(!ok) toast('No se pudo guardar. Intenta de nuevo.', 'err');
  }catch(e){
    toast('No se pudo guardar. Intenta de nuevo.', 'err');
  }
}
async function persistGroups(){
  if(firebaseEnabled() && currentUid){
    try{ await window.__firebaseBridge.saveData(currentUid, { groups }); }
    catch(e){ toast('No se pudo guardar en la nube. Revisa tu conexión.', 'err'); }
    return;
  }
  try{
    const ok = await storageSet(STORAGE_KEY_GROUPS, JSON.stringify(groups));
    if(!ok) toast('No se pudo guardar el grupo. Intenta de nuevo.', 'err');
  }catch(e){
    toast('No se pudo guardar el grupo. Intenta de nuevo.', 'err');
  }
}

/* ---- Firebase: sesión y sincronización en la nube ---- */
function initFirebaseAuthFlow(){
  window.__firebaseBridge.onAuthStateChanged((user) => {
    authChecked = true;
    if(user){
      currentUid = user.uid;
      loginError = '';
      startFirestoreSync(currentUid);
    } else {
      if(firebaseUnsubscribe){ firebaseUnsubscribe(); firebaseUnsubscribe = null; }
      currentUid = null;
      dataReady = false;
      clients = []; groups = [];
      render();
    }
  });
  render();
}

function startFirestoreSync(uidValue){
  dataReady = false;
  render();
  if(firebaseUnsubscribe){ firebaseUnsubscribe(); }
  firebaseUnsubscribe = window.__firebaseBridge.watchData(
    uidValue,
    (snap) => {
      if(snap.exists && snap.exists()){
        const data = snap.data();
        clients = (data.clients || []).map(normalizeClient);
        groups = (data.groups && data.groups.length) ? data.groups : seedDefaultGroups();
      } else {
        groups = seedDefaultGroups();
        clients = [];
        window.__firebaseBridge.saveData(uidValue, { clients, groups });
      }
      dataReady = true;
      render();
    },
    () => {
      toast('No se pudo sincronizar con la nube. Revisa tu conexión.', 'err');
    }
  );
}

function attachLoginHandlers(){
  const toggleBtn = document.getElementById('login-toggle-btn');
  if(toggleBtn) toggleBtn.addEventListener('click', () => { loginMode = loginMode==='signup' ? 'signin' : 'signup'; loginError=''; render(); });
  const submitBtn = document.getElementById('login-submit-btn');
  if(submitBtn) submitBtn.addEventListener('click', handleLoginSubmit);
  ['login-email','login-password'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('keydown', (e) => { if(e.key === 'Enter') handleLoginSubmit(); });
  });
}

async function handleLoginSubmit(){
  const email = (document.getElementById('login-email')||{}).value?.trim() || '';
  const password = (document.getElementById('login-password')||{}).value || '';
  if(!email || !password){ loginError = 'Ingresa tu correo y contraseña.'; render(); return; }
  try{
    if(loginMode === 'signup'){
      await window.__firebaseBridge.signUp(email, password);
    } else {
      await window.__firebaseBridge.signIn(email, password);
    }
    loginError = '';
    // onAuthStateChanged se dispara solo y actualiza la vista con los datos
  }catch(e){
    loginError = friendlyAuthError(e.code);
    render();
  }
}

function friendlyAuthError(code){
  const map = {
    'auth/email-already-in-use': 'Ese correo ya tiene una cuenta — mejor inicia sesión.',
    'auth/invalid-email': 'Ese correo no parece válido.',
    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/user-not-found': 'No hay ninguna cuenta con ese correo — puedes crear una.',
    'auth/invalid-credential': 'Correo o contraseña incorrectos.',
    'auth/too-many-requests': 'Demasiados intentos — espera un momento e intenta de nuevo.',
  };
  return map[code] || 'Ocurrió un error. Intenta de nuevo.';
}

/* ---- Confirmación propia (el confirm() nativo del navegador no funciona
   dentro del visor de artefactos de Claude.ai) ---- */
function showConfirm(message, confirmLabel){
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box" style="max-width:420px;">
        <h2>Confirmar</h2>
        <p class="modal-sub">${escapeHtml(message)}</p>
        <div class="form-actions">
          <button class="btn btn-primary" id="confirm-yes-btn">${escapeHtml(confirmLabel || 'Eliminar')}</button>
          <button class="btn btn-ghost" id="confirm-no-btn">Cancelar</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const finish = (result) => { overlay.remove(); resolve(result); };
    overlay.querySelector('#confirm-yes-btn').addEventListener('click', () => finish(true));
    overlay.querySelector('#confirm-no-btn').addEventListener('click', () => finish(false));
    overlay.addEventListener('click', (e) => { if(e.target === overlay) finish(false); });
  });
}

/* ---- Respaldo manual (exportar / importar) ---- */
function exportData(){
  const payload = { exportedAt: new Date().toISOString(), clients, groups };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `respaldo-clientes-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Respaldo descargado.');
}

async function handleImportFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!Array.isArray(data.clients) || !Array.isArray(data.groups)){
      toast('Ese archivo no tiene el formato de un respaldo válido.', 'err');
      e.target.value = '';
      return;
    }
    const proceed = await showConfirm(`Esto reemplazará tus ${clients.length} cliente(s) actuales por ${data.clients.length} del archivo.`, 'Reemplazar datos');
    if(!proceed){ e.target.value = ''; return; }
    clients = data.clients;
    groups = data.groups;
    await persistClients();
    await persistGroups();
    toast('Datos importados correctamente.');
    render();
  }catch(err){
    toast('No se pudo leer el archivo. Verifica que sea un respaldo válido.', 'err');
  }
  e.target.value = '';
}

      ${clientGroupFilter.length > 1 ? `<p class="sub" style="margin:-8px 0 14px 0;">Mostrando solo clientes que tienen los ${clientGroupFilter.length} intereses seleccionados a la vez.</p>` : ''}

          <tbody>
            ${list.map(c => `
              <tr style="${reminderRowStyle(c)}">

                <td data-label="Estado">${statusBadgeHtml(c.status)}</td>
                <td data-label="Teléfono">${c.phone ? `<a class="contact-link" target="_blank" rel="noopener" href="${waLink(c.phone)}">${escapeHtml(c.phone)}</a>` : '—'}</td>

function renderGroupsTab(){

    const q = groupSearch.trim().toLowerCase();
    list = list.filter(g => g.name.toLowerCase().includes(q));
  }

  return `
    <div class="panel">
      <div class="panel-head">
        <h2>Tus grupos</h2>
      </div>
      <div class="filter-row">
        <input class="input search-input" id="group-search" placeholder="Buscar grupo por nombre o zona" value="${escapeHtml(groupSearch)}">

        <input class="input" id="new-group-name" placeholder="Nuevo grupo — ej. Terreno en San Vicente">
        <button class="btn btn-secondary" id="add-group-btn">+ Crear grupo</button>
      </div>

      ${groups.length===0 ? `
        <div class="empty">
          <div class="empty-title">No tienes grupos todavía</div>
          <p>Crea un grupo por cada tipo de propiedad o zona que manejas.</p>
        </div>

function renderGroupCard(g){
  const members = clientsInGroup(g.id).sort((a,b) => a.name.localeCompare(b.name,'es'));
  const expanded = expandedGroupId === g.id;
  const emails = members.filter(m => m.email).map(m => m.email);
  const phones = members.filter(m => m.phone).map(m => m.phone);

  const isEditing = editingGroupId === g.id;

  return `
    <div class="group-card" style="border-left: 4px solid ${colorForGroup(g)};">
      <div class="group-card-head" ${isEditing ? '' : `data-togglegroup="${g.id}"`}>
        ${isEditing ? `
          <div class="group-card-title" style="flex:1;">
            ${colorDot(colorForGroup(g), 10)}
            <input class="input" id="rename-input-${g.id}" data-renaming="${g.id}" value="${escapeHtml(g.name)}" style="max-width:320px;">
          </div>
          <div class="group-card-actions">
            <button class="link-btn" data-savegroupname="${g.id}">Guardar</button>
            <button class="link-btn" data-cancelgroupname="${g.id}">Cancelar</button>
          </div>
        ` : `
          <div class="group-card-title">
            ${colorDot(colorForGroup(g), 10)}
            <h3>${escapeHtml(g.name)}</h3>
            <span class="group-card-count">${members.length} cliente${members.length===1?'':'s'}</span>
          </div>
          <div class="group-card-actions">
            <button class="link-btn" data-editgroup="${g.id}" title="Renombrar grupo">Editar</button>
            <button class="link-btn danger" data-deletegroup="${g.id}" title="Eliminar grupo">Eliminar</button>
            <span class="sub">${expanded ? '▲' : '▼'}</span>
          </div>
        `}
      </div>
      ${expanded && !isEditing ? `
        <div class="group-card-body">
          ${members.length === 0 ? `
            <p class="sub" style="padding:10px 0;">Ningún cliente en este grupo todavía. Asígnalo desde su ficha de registro.</p>
          ` : `
            <div class="group-bulk-actions">
              ${phones.length ? `<button class="btn btn-ghost" data-copyphones="${g.id}">Copiar teléfonos (${phones.length})</button>` : ''}
              ${emails.length ? `<a class="btn btn-ghost" style="text-decoration:none;display:inline-block;" href="mailto:?bcc=${encodeURIComponent(emails.join(','))}&subject=${encodeURIComponent('Nueva propiedad: ' + g.name)}">Enviar correo al grupo (${emails.length})</a>` : ''}
            </div>
            ${members.map(m => `
              <div class="group-member">
                <div>
                  <div style="font-weight:600;">${escapeHtml(m.name)}</div>
                  <div class="sub">${m.budget ? escapeHtml(m.budget) : ''}</div>
                </div>
                <div style="text-align:right;">
                  ${m.phone ? `<div><a class="contact-link" target="_blank" rel="noopener" href="${waLink(m.phone)}">${escapeHtml(m.phone)}</a></div>` : ''}
                  ${m.email ? `<div class="sub">${escapeHtml(m.email)}</div>` : ''}
                </div>
              </div>
            `).join('')}
          `}
        </div>
      ` : ''}
    </div>
  `;
}

/* ============================================================
   FORMULARIO DE CLIENTE (nuevo / edición) — HTML compartido

    <div class="form-grid">
      <div class="field ${err('name')}">
        <label for="${prefix}-name">Nombre completo</label>
        <input class="input" id="${prefix}-name" value="${escapeHtml(c.name)}" placeholder="Ej. María Fernanda Zambrano">
        ${errMsg('name')}
      </div>
      <div class="field ${err('phone')}">
        <label for="${prefix}-phone">Teléfono</label>
        <input class="input" id="${prefix}-phone" value="${escapeHtml(c.phone)}" placeholder="Ej. 0991234567">

        <div class="hint">Se usa para el enlace directo a WhatsApp.</div>
      </div>
      <div class="field">
        <label for="${prefix}-email">Correo</label>
        <input class="input" id="${prefix}-email" value="${escapeHtml(c.email)}" placeholder="Ej. maria@correo.com">
      </div>
      <div class="field">
        <label for="${prefix}-budget">Presupuesto</label>
        <input class="input" id="${prefix}-budget" value="${escapeHtml(c.budget)}" placeholder="Ej. $80,000 - $120,000">
      </div>
      <div class="field">
        <label for="${prefix}-date">Fecha de registro</label>
        <input class="input" type="date" id="${prefix}-date" value="${c.createdAt || todayStr()}">
      </div>
      <div class="field">
        <label>Estado del cliente</label>
        <div class="status-picker" id="${prefix}-status">
          ${STATUS_OPTIONS.map(s => `
            <button type="button" class="status-chip ${((c.status||'')===s.id)?'active':''}" data-statusoption="${s.id}" style="--status-color:${s.color};">
              ${colorDot(((c.status||'')===s.id) ? '#fff' : s.color)}${escapeHtml(s.label)}
            </button>
          `).join('')}
        </div>
      </div>
      <div class="field full">
        <label>
          <input type="checkbox" id="${prefix}-reminder-toggle" data-remindertoggle="${prefix}" ${c.reminder ? 'checked' : ''} style="margin-right:6px; vertical-align:-2px;">
          Ponerme un recordatorio
        </label>
        <div class="reminder-fields" id="${prefix}-reminder-fields" style="${c.reminder ? '' : 'display:none;'}">
          <div class="field" style="margin-bottom:0;">
            <label for="${prefix}-reminder-date">Fecha</label>
            <input class="input" type="date" id="${prefix}-reminder-date" value="${(c.reminder && c.reminder.date) || todayStr()}">

          <div class="field" style="margin-bottom:0; flex:1;">
            <label for="${prefix}-reminder-note">¿Qué debes hacer? (opcional)</label>

          </div>
        </div>
        <div class="hint">Ese día, este cliente aparecerá resaltado al abrir el panel, hasta que marques el recordatorio como listo.</div>
      </div>
      <div class="field full">
        <label>Interés (puede marcar varios)</label>

/* ============================================================
   VALIDACIÓN Y GUARDADO
============================================================ */
function readFormValues(prefix){
  const getVal = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const groupIds = Array.from(document.querySelectorAll(`#${prefix}-groups input[type="checkbox"]:checked`)).map(cb => cb.value);
  const statusEl = document.querySelector(`#${prefix}-status .status-chip.active`);
  const status = statusEl ? statusEl.getAttribute('data-statusoption') : '';
  const reminderToggle = document.getElementById(`${prefix}-reminder-toggle`);
  let reminder = null;
  if(reminderToggle && reminderToggle.checked){
    reminder = {
      date: getVal(`${prefix}-reminder-date`) || todayStr(),
      note: getVal(`${prefix}-reminder-note`),
    };
  }
  return {
    name: getVal(`${prefix}-name`),
    phone: getVal(`${prefix}-phone`),
    email: getVal(`${prefix}-email`),
    budget: getVal(`${prefix}-budget`),
    createdAt: getVal(`${prefix}-date`) || todayStr(),
    groupIds,
    status,
    reminder,
  };
}

function validate(values){
  const errors = {};
  if(!values.name) errors.name = 'Ingresa el nombre completo.';
  if(!values.phone) errors.phone = 'Ingresa un teléfono de contacto.';
  return errors;
}

async function handleSaveNewClient(){
  const values = readFormValues('f');
  const errors = validate(values);
  formErrors = errors;
  if(Object.keys(errors).length > 0){ render(); return; }
  const noteEl = document.getElementById('f-notes');
  const noteText = noteEl ? noteEl.value.trim() : '';
  const notes = noteText ? [{ id: uid(), text: noteText, date: values.createdAt }] : [];
  clients.push({ id: uid(), ...values, notes });
  await persistClients();
  formErrors = {};
  toast(`${values.name} fue registrado.`);
  activeTab = 'clients';
  render();
}

async function handleSaveEditClient(){
  const values = readFormValues('m');
  const errors = validate(values);
  modalFormErrors = errors;
  if(Object.keys(errors).length > 0){ render(); return; }
  const idx = clients.findIndex(c => c.id === modalClientId);
  if(idx >= 0){ clients[idx] = { ...clients[idx], ...values }; }
  await persistClients();
  modalFormErrors = {};
  const name = values.name;
  modalClientId = null;
  toast(`Cambios guardados para ${name}.`);
  render();
}

async function handleDeleteClient(id){
  const c = clients.find(x => x.id === id);
  if(!c) return;
  if(!(await showConfirm(`¿Eliminar a ${c.name} de tus clientes?`))) return;
  clients = clients.filter(x => x.id !== id);
  await persistClients();
  toast('Cliente eliminado.');
  render();
}

async function handleAddNote(clientId){
  const ta = document.getElementById(`new-note-text-${clientId}`);
  const text = ta ? ta.value.trim() : '';
  if(!text){ toast('Escribe algo antes de agregar la nota.', 'err'); return; }
  const c = clients.find(x => x.id === clientId);
  if(!c) return;
  if(!Array.isArray(c.notes)) c.notes = [];
  c.notes.push({ id: uid(), text, date: todayStr() });
  await persistClients();
  toast('Nota agregada.');
  render();
}

async function handleDeleteNote(clientId, noteId){
  const c = clients.find(x => x.id === clientId);
  if(!c) return;
  if(!(await showConfirm('¿Eliminar esta nota del historial?'))) return;
  c.notes = (c.notes||[]).filter(n => n.id !== noteId);
  await persistClients();
  toast('Nota eliminada.');
  render();
}

async function handleAddGroupInline(prefix){
  const input = document.getElementById(`${prefix}-newgroup`);
  const name = input.value.trim();
  if(!name) return;
  const existing = groups.find(g => g.name.toLowerCase() === name.toLowerCase());
  let g = existing;
  if(!existing){
    g = { id: uid(), name, createdAt: todayStr() };
    groups.push(g);
    await persistGroups();
    toast(`Grupo "${name}" creado.`);
  }
  // Vuelve a pintar y marca el checkbox del grupo recién creado/usado, preservando el resto del formulario
  const currentValues = readFormValues(prefix);
  if(!currentValues.groupIds.includes(g.id)) currentValues.groupIds.push(g.id);
  const noteEl = document.getElementById(`${prefix}-notes`);
  const noteVal = noteEl ? noteEl.value : null;
  if(prefix === 'f'){
    formErrors = {};
    render();
    restoreFormValues('f', currentValues, noteVal);
  } else {
    render();
    restoreFormValues('m', currentValues, noteVal);
  }
}

function restoreFormValues(prefix, values, noteVal){
  const setVal = (id, v) => { const el = document.getElementById(id); if(el && v !== null && v !== undefined) el.value = v; };
  setVal(`${prefix}-name`, values.name);
  setVal(`${prefix}-phone`, values.phone);
  setVal(`${prefix}-email`, values.email);
  setVal(`${prefix}-budget`, values.budget);
  setVal(`${prefix}-date`, values.createdAt);
  setVal(`${prefix}-notes`, noteVal);
  document.querySelectorAll(`#${prefix}-groups input[type="checkbox"]`).forEach(cb => {
    cb.checked = values.groupIds.includes(cb.value);
  });
  const picker = document.getElementById(`${prefix}-status`);
  if(picker){
    picker.querySelectorAll('.status-chip').forEach(b => {
      const isMatch = b.getAttribute('data-statusoption') === (values.status || '');
      b.classList.toggle('active', isMatch);
      const dot = b.querySelector('span');
      if(dot) dot.style.background = isMatch ? '#fff' : b.style.getPropertyValue('--status-color');
    });
  }
  const reminderToggle = document.getElementById(`${prefix}-reminder-toggle`);
  const reminderFields = document.getElementById(`${prefix}-reminder-fields`);
  if(reminderToggle){
    reminderToggle.checked = !!values.reminder;
    if(reminderFields) reminderFields.style.display = values.reminder ? 'flex' : 'none';
    if(values.reminder){
      setVal(`${prefix}-reminder-date`, values.reminder.date);
      setVal(`${prefix}-reminder-note`, values.reminder.note);
    }
  }
}

async function handleAddGroupStandalone(){
  const input = document.getElementById('new-group-name');
  const name = input.value.trim();
  if(!name){ return; }
  const existing = groups.find(g => g.name.toLowerCase() === name.toLowerCase());
  if(existing){ toast('Ese grupo ya existe.', 'err'); return; }
  groups.push({ id: uid(), name, createdAt: todayStr() });
  await persistGroups();
  toast(`Grupo "${name}" creado.`);
  render();
}

function startEditGroup(id){
  editingGroupId = id;
  expandedGroupId = null;
  render();
  const el = document.getElementById(`rename-input-${id}`);
  if(el){ el.focus(); el.select(); }
}
function cancelEditGroup(){
  editingGroupId = null;
  render();
}
async function saveEditGroup(id){
  const el = document.getElementById(`rename-input-${id}`);
  const newName = el ? el.value.trim() : '';
  if(!newName){ toast('El nombre del interés no puede quedar vacío.', 'err'); return; }
  const dup = groups.find(g => g.id !== id && g.name.toLowerCase() === newName.toLowerCase());
  if(dup){ toast('Ya existe un interés con ese nombre.', 'err'); return; }
  const g = groupById(id);
  if(g){ g.name = newName; }
  await persistGroups();
  editingGroupId = null;
  toast('Interés actualizado.');
  render();
}

async function handleDeleteGroup(id){
  const g = groupById(id);
  if(!g) return;
  const count = clientsInGroup(id).length;
  const msg = count > 0
    ? `${count} cliente${count===1?' tiene':'s tienen'} este interés asignado. ¿Eliminar igual el grupo "${g.name}"?`
    : `¿Eliminar el grupo "${g.name}"?`;
  if(!(await showConfirm(msg))) return;
  groups = groups.filter(x => x.id !== id);
  clients = clients.map(c => ({ ...c, groupIds: (c.groupIds||[]).filter(gid => gid !== id) }));
  await persistGroups();
  await persistClients();
  toast('Grupo eliminado.');
  render();
}

function handleCopyPhones(id){
  const members = clientsInGroup(id).filter(m => m.phone);
  const text = members.map(m => m.phone).join(', ');
  navigator.clipboard.writeText(text).then(() => {
    toast('Teléfonos copiados al portapapeles.');
  }).catch(() => {
    toast('No se pudo copiar. Selecciónalos manualmente.', 'err');
  });
}

/* ============================================================
   EVENTOS
============================================================ */
function attachGlobalHandlers(){
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.addEventListener('click', () => {
      activeTab = el.getAttribute('data-tab');
      formErrors = {};
      render();
    });
  });

  const searchEl = document.getElementById('client-search');
  if(searchEl){
    searchEl.addEventListener('input', (e) => {
      clientSearch = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const el2 = document.getElementById('client-search');
      if(el2){ el2.focus(); el2.setSelectionRange(pos,pos); }
    });
  }

  document.querySelectorAll('[data-groupfilter]').forEach(el => {
    el.addEventListener('click', () => {
      const v = el.getAttribute('data-groupfilter');
      if(!v){
        clientGroupFilter = [];
      } else if(clientGroupFilter.includes(v)){
        clientGroupFilter = clientGroupFilter.filter(id => id !== v);
      } else {
        clientGroupFilter = [...clientGroupFilter, v];
      }
      render();
    });
  });

  document.querySelectorAll('[data-statusfilter]').forEach(el => {
    el.addEventListener('click', () => {
      const v = el.getAttribute('data-statusfilter');
      if(clientStatusFilter.includes(v)){
        clientStatusFilter = clientStatusFilter.filter(id => id !== v);
      } else {
        clientStatusFilter = [...clientStatusFilter, v];
      }
      render();
    });
  });

  document.querySelectorAll('[data-edit]').forEach(el => {
    el.addEventListener('click', () => { modalClientId = el.getAttribute('data-edit'); modalFormErrors = {}; render(); });
  });
  document.querySelectorAll('[data-delete]').forEach(el => {
    el.addEventListener('click', () => handleDeleteClient(el.getAttribute('data-delete')));
  });

  const groupSearchEl = document.getElementById('group-search');
  if(groupSearchEl){
    groupSearchEl.addEventListener('input', (e) => {
      groupSearch = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const el2 = document.getElementById('group-search');
      if(el2){ el2.focus(); el2.setSelectionRange(pos,pos); }
    });
  }
  const addGroupBtn = document.getElementById('add-group-btn');
  if(addGroupBtn) addGroupBtn.addEventListener('click', handleAddGroupStandalone);

  document.querySelectorAll('[data-togglegroup]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-togglegroup');
      expandedGroupId = expandedGroupId === id ? null : id;
      render();
    });
  });
  document.querySelectorAll('[data-deletegroup]').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); handleDeleteGroup(el.getAttribute('data-deletegroup')); });
  });
  document.querySelectorAll('[data-editgroup]').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); startEditGroup(el.getAttribute('data-editgroup')); });
  });
  document.querySelectorAll('[data-savegroupname]').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); saveEditGroup(el.getAttribute('data-savegroupname')); });
  });
  document.querySelectorAll('[data-cancelgroupname]').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); cancelEditGroup(); });
  });
  document.querySelectorAll('[data-renaming]').forEach(el => {
    el.addEventListener('click', (e) => e.stopPropagation());
    el.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); saveEditGroup(el.getAttribute('data-renaming')); }
      if(e.key === 'Escape'){ e.preventDefault(); cancelEditGroup(); }
    });
  });
  document.querySelectorAll('[data-copyphones]').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); handleCopyPhones(el.getAttribute('data-copyphones')); });
  });

  document.querySelectorAll('[data-addgroupinline]').forEach(el => {
    el.addEventListener('click', () => handleAddGroupInline(el.getAttribute('data-addgroupinline')));
  });

  const saveNewBtn = document.getElementById('save-new-client');
  if(saveNewBtn) saveNewBtn.addEventListener('click', handleSaveNewClient);

  const saveEditBtn = document.getElementById('save-edit-client');
  if(saveEditBtn) saveEditBtn.addEventListener('click', handleSaveEditClient);
  const cancelEditBtn = document.getElementById('cancel-edit-client');
  if(cancelEditBtn) cancelEditBtn.addEventListener('click', () => { modalClientId = null; modalFormErrors = {}; render(); });
  const overlay = document.getElementById('modal-overlay');
  if(overlay){
    overlay.addEventListener('click', (e) => {
      if(e.target === overlay){ modalClientId = null; modalFormErrors = {}; render(); }
    });
  }

  const exportBtn = document.getElementById('export-data-btn');
  if(exportBtn) exportBtn.addEventListener('click', exportData);
  const importBtn = document.getElementById('import-data-btn');
  const importInput = document.getElementById('import-file-input');
  if(importBtn && importInput){
    importBtn.addEventListener('click', () => importInput.click());
    importInput.addEventListener('change', handleImportFile);
  }

  document.querySelectorAll('[data-statusoption]').forEach(el => {
    el.addEventListener('click', () => {
      const picker = el.closest('.status-picker');
      if(!picker) return;
      picker.querySelectorAll('.status-chip').forEach(b => {
        b.classList.remove('active');
        const dot = b.querySelector('span');
        const color = b.style.getPropertyValue('--status-color');
        if(dot) dot.style.background = color;
      });
      el.classList.add('active');
      const activeDot = el.querySelector('span');
      if(activeDot) activeDot.style.background = '#fff';
    });
  });

  document.querySelectorAll('[data-addnote]').forEach(el => {
    el.addEventListener('click', () => handleAddNote(el.getAttribute('data-addnote')));
  });
  document.querySelectorAll('[data-deletenote]').forEach(el => {
    el.addEventListener('click', () => {
      const [clientId, noteId] = el.getAttribute('data-deletenote').split(':');
      handleDeleteNote(clientId, noteId);
    });
  });

  document.querySelectorAll('[data-remindertoggle]').forEach(el => {
    el.addEventListener('change', () => {
      const prefix = el.getAttribute('data-remindertoggle');
      const fields = document.getElementById(`${prefix}-reminder-fields`);
      if(fields) fields.style.display = el.checked ? 'flex' : 'none';
    });
  });
  document.querySelectorAll('[data-dismissreminder]').forEach(el => {
    el.addEventListener('click', () => handleDismissReminder(el.getAttribute('data-dismissreminder')));
  });
  const signoutBtn = document.getElementById('signout-btn');
  if(signoutBtn) signoutBtn.addEventListener('click', handleSignOut);
}

let appStarted = false;
function startAppOnce(){
  if(appStarted) return;
  appStarted = true;
  loadAll();
}
if(window.__firebaseBridge){
  startAppOnce();
} else {
  window.addEventListener('firebase-bridge-ready', startAppOnce, { once: true });
  // Si el módulo de Firebase no responde pronto (sin internet, bloqueado por
  // el navegador, etc.), la app arranca igual en modo normal — nunca se
  // queda colgada esperando algo que quizá no vaya a llegar.
  setTimeout(startAppOnce, 1200);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {
      // si no está hospedado (o no hay service-worker.js junto al html), no pasa nada
    });
  });
}
</script>
</body>
</html>
